<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="결박 cho">
  <title>결박 cho</title>
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="40" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="32" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#carve)" fill="none" stroke="#1D6B3F" stroke-linecap="round">
    <circle cx="50" cy="50" r="35" stroke-width="5" stroke-dasharray="14 10"/>
    <circle cx="50" cy="50" r="26" stroke-width="2.4" opacity=".55"/>
    <path d="M50 24 v-10 M50 76 v10 M24 50 h-10 M76 50 h10" stroke-width="4"/>
    <path d="M37 37 L63 63 M63 37 L37 63" stroke-width="4.4" opacity=".9"/>
  </g>
  <g fill="#1D6B3F"><circle cx="50" cy="15" r="4"/><circle cx="50" cy="85" r="4"/>
    <circle cx="15" cy="50" r="4"/><circle cx="85" cy="50" r="4"/></g>
</svg>