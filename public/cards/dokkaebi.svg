<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="33" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="25" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.62) translate(-50,-50)" filter="url(#carve)"><g>
      <path d="M28 34 q-6 -14 -2 -22 q8 5 11 16 Z" fill="#B0302A"/>
      <path d="M72 34 q6 -14 2 -22 q-8 5 -11 16 Z" fill="#B0302A"/>
      <path d="M50 24 q24 0 27 23 q3 23 -6 35 q-8 10 -21 10 t-21 -10 q-9 -12 -6 -35 q3 -23 27 -23 Z" fill="#B0302A"/>
      <ellipse cx="38" cy="46" rx="8" ry="9" fill="#EFE8D8"/><ellipse cx="62" cy="46" rx="8" ry="9" fill="#EFE8D8"/>
      <circle cx="39" cy="47" r="3.6" fill="#B0302A"/><circle cx="61" cy="47" r="3.6" fill="#B0302A"/>
      <path d="M33 65 q17 10 34 0 q-3 12 -17 12 t-17 -12 Z" fill="#EFE8D8"/>
