<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="24" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.62) translate(-50,-50)" filter="url(#carve)"><g>
      <path d="M46 60 q4 -6 8 0 q10 4 12 16 q1 8 -2 12 H36 q-3 -4 -2 -12 q2 -12 12 -16 Z" fill="#B0302A"/>
      <path d="M34 44 q0 22 16 22 t16 -22 Z" fill="#B0302A"/>
      <rect x="10" y="38" width="80" height="7" rx="3.5" fill="#B0302A"/>
      <ellipse cx="50" cy="38" rx="40" ry="5" fill="#B0302A"/>
      <path d="M38 36 q0 -20 12 -20 t12 20 Z" fill="#B0302A"/>
      <path d="M40 50 q5 -5 11 -1 q-6 5 -11 1 Z" fill="#EFE8D8"/>
      <path d="M60 50 q-5 -5 -11 -1 q6 5 11 1 Z" fill="#EFE8D8"/>
      <circle cx="45" cy="49" r="2.2" fill="#B0302A"/><circle cx="55" cy="49" r="2.2" fill="#B0302A"/>
      <path d="M42 30 h16" stroke="#EFE8D8" stroke-width="2.6" stroke-linecap="round"/>
    </g></g>
</svg>