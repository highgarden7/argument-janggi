<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="30" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.62) translate(-50,-50)" filter="url(#carve)"><g>
      <path d="M18 44 h48 l6 5 v10 l-6 5 H18 q-4 -10 0 -20 Z" fill="#B0302A"/>
      <path d="M72 46 h12 v16 h-12 Z" fill="#B0302A"/>
      <path d="M20 64 l-6 14 h44 l-6 -14 Z" fill="#B0302A"/>
      <circle cx="26" cy="80" r="6" fill="#B0302A"/><circle cx="26" cy="80" r="2.2" fill="#EFE8D8"/>
      <path d="M14 52 h-8 M14 58 h-8" stroke="#B0302A" stroke-width="2.4" stroke-linecap="round"/>
      <g fill="#B0302A">
        <path d="M86 54 q10 -8 16 -4 q-4 4 -8 4 q6 1 8 4 q-8 3 -16 -4 Z"/>
        <circle cx="92" cy="42" r="2.6"/><circle cx="99" cy="48" r="1.8"/><circle cx="95" cy="66" r="2.2"/>
      </g>
    </g></g>
</svg>