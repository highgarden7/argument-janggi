      <path d="M44 60 h12 M43 70 h14" stroke="#EFE8D8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M41 56 L24 48" stroke="#B0302A" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M59 56 L76 48" stroke="#B0302A" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M2 40 A26 26 0 0 1 30 28 L24 52 Z" fill="#B0302A"/>
      <g stroke="#EFE8D8" stroke-width="1.6" fill="none">
        <path d="M8 36 L23 48 M15 31 L26 47 M22 29 L28 45"/>
