<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="193" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="204" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="196" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="#B0302A" filter="url(#carveHard)"/><rect x="21" y="21" width="198" height="198" rx="2" fill="none" stroke="#EFE8D8" stroke-width="3.4" opacity=".9" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.72) translate(-50,-50)" filter="url(#carve)"><g>
      <g stroke="#EFE8D8" stroke-width="4" fill="none"><rect x="22" y="22" width="56" height="56"/></g>
      <g stroke="#EFE8D8" stroke-width="3" opacity=".3" stroke-dasharray="5 5">
        <path d="M22 22 L78 78 M78 22 L22 78"/>
      </g>
      <g stroke="#EFE8D8" stroke-width="5" stroke-linecap="round">
        <path d="M30 62 L46 46 M46 62 L30 46"/><path d="M54 62 L70 46 M70 62 L54 46"/>
      </g>
      <g stroke="#EFE8D8" stroke-width="4" stroke-linecap="round">
        <path d="M22 50 h56 M50 22 v56"/>
      </g>
    </g></g>
</svg>