<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="133" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="144" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="136" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.72) translate(-50,-50)" filter="url(#carve)"><g>
      <g fill="none" opacity="0.55"><rect x="21.0" y="17.0" width="58" height="58" stroke="#B0302A" stroke-width="3.4"/><path d="M21.0 17.0 L79.0 75.0 M79.0 17.0 L21.0 75.0" stroke="#B0302A" stroke-width="1.43" opacity=".5"/></g>
      <ellipse cx="50" cy="66" rx="30" ry="18" fill="#B0302A"/>
      <ellipse cx="50" cy="61" rx="30" ry="18" fill="none" stroke="#B0302A" stroke-width="3.4"/>
      <g fill="#B0302A"><path d="M26 72 l4 -11 l4 11 Z"/><path d="M34 72 l4 -11 l4 11 Z"/><path d="M42 72 l4 -11 l4 11 Z"/><path d="M50 72 l4 -11 l4 11 Z"/><path d="M58 72 l4 -11 l4 11 Z"/><path d="M66 72 l4 -11 l4 11 Z"/></g>
      <path d="M50 22 v10 M42 28 l8 8 l8 -8" stroke="#B0302A" stroke-width="3.4" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g></g>
</svg>