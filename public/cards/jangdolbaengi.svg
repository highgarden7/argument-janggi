<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="40" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="51" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.62) translate(-50,-50)" filter="url(#carve)"><g>
      <path d="M60 46 q22 -4 26 14 q3 18 -8 26 q-14 4 -22 -6 q-6 -18 4 -34 Z" fill="#B0302A"/>
      <path d="M60 50 q14 22 4 34" stroke="#EFE8D8" stroke-width="2.4" fill="none"/>
      <path d="M66 44 q6 -8 14 -2 q-6 2 -8 6 Z" fill="#B0302A"/>
      <circle cx="42" cy="26" r="9" fill="#B0302A"/>
      <path d="M32 22 q10 -6 20 0 q-10 3 -20 0 Z" fill="#B0302A"/>
      <path d="M36 36 q8 -4 14 0 q6 14 4 26 l-4 24 h-8 l-2 -22 l-6 20 h-8 q4 -30 10 -48 Z" fill="#B0302A"/>
      <path d="M36 44 L22 60" stroke="#B0302A" stroke-width="4" stroke-linecap="round"/>
      <path d="M22 30 v54" stroke="#B0302A" stroke-width="3.4" stroke-linecap="round"/>
    </g></g>
</svg>