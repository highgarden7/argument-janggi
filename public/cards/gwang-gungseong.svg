<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="127" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="138" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="130" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.72) translate(-50,-50)" filter="url(#carve)"><g>
      <g fill="none" opacity="0.35"><rect x="33.0" y="33.0" width="34" height="34" stroke="#B0302A" stroke-width="2.6"/><path d="M33.0 33.0 L67.0 67.0 M67.0 33.0 L33.0 67.0" stroke="#B0302A" stroke-width="1.09" opacity=".5"/></g>
      <g stroke="#B0302A" stroke-width="4" fill="none">
        <rect x="16" y="16" width="68" height="68"/>
        <path d="M16 39 h68 M16 61 h68 M39 16 v68 M61 16 v68" stroke-width="1.8" opacity=".55"/>
        <path d="M16 16 L84 84 M84 16 L16 84" stroke-width="1.4" opacity=".3"/>
      </g>
      <g stroke="#B0302A" stroke-width="3" stroke-linecap="round">
        <path d="M8 8 l6 6 M92 8 l-6 6 M8 92 l6 -6 M92 92 l-6 -6"/>
      </g>
    </g></g>
</svg>