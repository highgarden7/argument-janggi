      <path d="M36 50 q14 -6 28 0 q9 16 7 36 H29 q-2 -20 7 -36 Z" fill="#B0302A"/>
      <path d="M40 54 q10 20 4 32" stroke="#EFE8D8" stroke-width="2.4" fill="none"/>
      <g fill="#B0302A"><circle cx="76.0" cy="62.0" r="2.7"/><circle cx="72.5" cy="68.5" r="2.7"/><circle cx="63.0" cy="73.3" r="2.7"/><circle cx="50.0" cy="75.0" r="2.7"/><circle cx="37.0" cy="73.3" r="2.7"/><circle cx="27.5" cy="68.5" r="2.7"/><circle cx="24.0" cy="62.0" r="2.7"/><circle cx="27.5" cy="55.5" r="2.7"/><circle cx="37.0" cy="50.7" r="2.7"/><circle cx="50.0" cy="49.0" r="2.7"/><circle cx="63.0" cy="50.7" r="2.7"/><circle cx="72.5" cy="55.5" r="2.7"/></g>
