<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="169" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="180" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="172" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.72) translate(-50,-50)" filter="url(#carve)"><g>
      <path d="M12 30 h76 M12 56 h76 M32 12 v72 M62 12 v72"
            stroke="#B0302A" stroke-width="1.8" opacity=".4"/>
      <g stroke="#B0302A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 74 L32 56 M32 56 L62 56 M62 56 L74 30"/>
      </g>
      <path d="M74 30 l-9 2 l2 9" fill="none" stroke="#B0302A" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#B0302A"><circle cx="20" cy="74" r="5"/><circle cx="32" cy="56" r="5"/><circle cx="62" cy="56" r="5"/></g>
      <g fill="#EFE8D8" font-family="monospace"><circle cx="20" cy="74" r="1.8"/></g>
    </g></g>
</svg>