<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="54" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="46" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.62) translate(-50,-50)" filter="url(#carve)"><g>
      <path d="M34 26 h32 v12 H34 Z" fill="#B0302A"/>
      <path d="M30 26 q20 -14 40 0 Z" fill="#B0302A"/>
      <path d="M28 30 q-10 2 -10 8 q8 2 12 -2 Z" fill="#B0302A"/>
      <path d="M72 30 q10 2 10 8 q-8 2 -12 -2 Z" fill="#B0302A"/>
      <circle cx="50" cy="47" r="8" fill="#B0302A"/>
      <path d="M38 58 q12 -5 24 0 q7 15 5 30 H33 q-2 -15 5 -30 Z" fill="#B0302A"/>
      <path d="M50 60 v26" stroke="#EFE8D8" stroke-width="2.6"/>
      <path d="M44 62 h12" stroke="#EFE8D8" stroke-width="2.2"/>
      <path d="M66 52 h7 v26 h-7 Z" fill="#B0302A"/>
    </g></g>
</svg>