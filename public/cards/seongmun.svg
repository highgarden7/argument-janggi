<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<defs>
    <filter id="carve" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="157" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="168" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  
    <filter id="carveHard" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="2" seed="160" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="6" fill="#EFE8D8"/>
  <rect x="10" y="10" width="220" height="220" rx="4" fill="none" stroke="#B0302A" stroke-width="8" filter="url(#carveHard)"/><rect x="24" y="24" width="192" height="192" rx="2" fill="none" stroke="#B0302A" stroke-width="1.8" opacity=".5" filter="url(#carve)"/>
  <g transform="translate(120.0,120.0) scale(1.72) translate(-50,-50)" filter="url(#carve)"><g>
      <g fill="none" opacity="1.0"><rect x="22.0" y="28.0" width="56" height="56" stroke="#B0302A" stroke-width="3.4"/><path d="M22.0 28.0 L78.0 84.0 M78.0 28.0 L22.0 84.0" stroke="#B0302A" stroke-width="1.43" opacity=".5"/></g>
      <rect x="18" y="22" width="64" height="13" rx="2" fill="#B0302A"/>
      <rect x="38" y="22" width="24" height="13" fill="#EFE8D8"/>
      <path d="M38 35 v-6 q12 -8 24 0 v6" fill="none" stroke="#B0302A" stroke-width="3.4"/>
      <g stroke="#EFE8D8" stroke-width="2.2"><path d="M18 28 h20 M62 28 h20 M28 22 v6 M72 22 v6"/></g>
      <path d="M50 4 v12 M43 11 l7 7 l7 -7" stroke="#B0302A" stroke-width="3.6" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#B0302A" stroke-width="3" stroke-linecap="round" opacity=".45">
        <path d="M16 12 L26 22 M84 12 L74 22"/>
